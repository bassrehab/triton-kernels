# kernel-builder configuration for the fused MoE dispatch kernel (edition 5).
#
# Pure-Triton kernel: no C++/CUDA to compile. Declared as a torch-noarch (JIT)
# kernel so one artifact runs on every Triton backend. Schema mirrors the current
# huggingface/kernels relu-triton example.
#
# subhadipmitra, 2026-07-21: use the CURRENT kernel-builder toolchain (edition 5,
# torch-noarch) instead of pinning an old release. The old pin cache-missed HF's
# binary cache and rebuilt torch/LLVM/CUDA from source (hours); the current
# toolchain's deps are prebuilt in the cache, so the build is fast.

[general]
name = "moe-dispatch"
version = 1
edition = 5
license = "MIT"
backends = [
    "cuda",
    "rocm",
]

[general.hub]
repo-id = "bassrehab/moe-dispatch"

[torch-noarch]
